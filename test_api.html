<!DOCTYPE html>
<html>
<head>
    <title>API Connection Test</title>
</head>
<body>
    <h1>API Connection Test</h1>
    <button onclick="testAPI()">Test Backend Connection</button>
    <div id="results"></div>

    <script>
        async function testAPI() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>Testing...</p>';
            
            try {
                console.log('Testing API connection...');
                const response = await fetch('http://localhost:8001/api/health');
                console.log('Response status:', response.status);
                
                if (response.ok) {
                    const data = await response.json();
                    results.innerHTML = `
                        <p style="color: green;">✅ Backend Connection Successful!</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    results.innerHTML = `<p style="color: red;">❌ Backend returned status: ${response.status}</p>`;
                }
            } catch (error) {
                console.error('Connection error:', error);
                results.innerHTML = `<p style="color: red;">❌ Connection failed: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
